<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Souvenir · First setup</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef4f5;color:#12313e;font:16px system-ui,sans-serif}.top{background:#12313e;border-bottom:4px solid #dfb95b;padding:22px;color:white;display:flex;align-items:center;gap:16px}.top img{width:66px;height:58px;object-fit:contain;background:white;border-radius:8px}main{max-width:680px;margin:28px auto;padding:26px;background:white;border-radius:14px;box-shadow:0 8px 32px #12313e12}h1{font-size:24px;margin:0}h2{font-size:21px}p{line-height:1.6}label{display:block;font-weight:600;margin-top:16px}input{display:block;width:100%;padding:12px;border:1px solid #c8d7da;border-radius:7px;margin-top:6px;font:inherit}button{background:#087e7c;color:white;border:0;border-radius:7px;font:inherit;font-weight:600;padding:13px 20px;margin-top:24px;cursor:pointer}button:disabled{opacity:.6}#status{white-space:pre-wrap}a{color:#087e7c}@media(max-width:700px){main{margin:16px;padding:20px}.top{padding:16px}}
</style><script src="config.js"></script><script>window.STANDALONE_BOOT={appId:'souvenir-turso-v1'};</script><script src="client.js"></script></head><body><header class="top"><img src="assets/school-logo.jpg" alt="School crest"><h1>Souvenir School Office</h1></header><main><h2>First administrator setup</h2><p>Use this page once for your new Turso school. Existing Google Sheets records stay in their original location until you import a backup.</p><form id="setup"><label>Private setup token<input id="token" type="password" autocomplete="off" required minlength="32"></label><label>School name<input id="name" value="SOUVENIR MIXED PRIMARY NURSERY AND VOCATIONAL TRAINING SCHOOL" required></label><label>Administrator name<input id="admin" autocomplete="name" required></label><label>Phone number<input id="phone" type="tel" autocomplete="tel" required></label><label>New password<input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required></label><label>Academic year<input id="year" pattern="[0-9]{4}" required></label><button id="submit">Create school administrator</button></form><p id="status" role="status" aria-live="polite"></p><p><a href="index.html">Open the school app →</a></p></main><script>
year.value=String(new Date().getFullYear());document.getElementById('setup').onsubmit=async function(e){e.preventDefault();const button=document.getElementById('submit'),status=document.getElementById('status');button.disabled=true;try{
 const url=window.SOUVENIR_CONFIG?.apiUrl;if(!url||!url.startsWith('https://'))throw Error('Set apiUrl in config.js to your Worker HTTPS address first.');status.textContent='Creating your school. Please wait…';
 const salt=[...crypto.getRandomValues(new Uint8Array(32))].map(b=>b.toString(16).padStart(2,'0')).join('');const storedKey=await SouvenirPassword.deriveStoredKey(document.getElementById('password').value,salt);
 const r=await fetch(url.replace(/\/$/,'')+'/setup',{method:'POST',headers:{'Content-Type':'application/json','X-Setup-Token':document.getElementById('token').value},body:JSON.stringify({name:document.getElementById('name').value,admin:document.getElementById('admin').value,phone:document.getElementById('phone').value,year:document.getElementById('year').value,salt,storedKey})});const result=await r.json();if(result.error)throw Error(result.error.message);document.getElementById('password').value='';document.getElementById('token').value='';status.textContent='Success. Open the school app and sign in with the phone number and password you just chose.';
 }catch(error){status.textContent=error.message}finally{button.disabled=false}};
</script></body></html>
